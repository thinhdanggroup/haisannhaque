# HTTP-only mode. Used before a TLS certificate exists, and to serve the
# ACME http-01 challenge that certbot needs in order to issue one.
#
# Switch to the ssl/ config by setting NGINX_MODE=ssl in .env — see
# scripts/init-letsencrypt.sh.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web_upstream {
    server web:3000;
    keepalive 16;
}

server {
    listen      80 default_server;
    server_name haisannhaque.com www.haisannhaque.com;

    # Product image uploads pass through Next.js route handlers.
    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass http://web_upstream;
    }
}
