# Shared reverse-proxy settings for the Next.js upstream.
# Included by both the http-only and ssl server blocks.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_cache_bypass $http_upgrade;
proxy_buffering    off;

# Response headers must fit in this buffer even with buffering off. The
# default (4k) is too small for a logged-in request: Supabase refreshes the
# chunked sb-*-auth-token Set-Cookie (~2.5k+) alongside Next's font-preload
# Link header (~1.4k), and nginx answers 502 "upstream sent too big header".
proxy_buffer_size       32k;
proxy_buffers           8 32k;
proxy_busy_buffers_size 64k;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
