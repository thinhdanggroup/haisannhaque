# TLS mode. Activated by scripts/init-letsencrypt.sh once certbot has issued
# a certificate for haisannhaque.com. Do NOT switch to this config before the
# cert exists — nginx will refuse to start on a missing ssl_certificate file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web_upstream {
    server web:3000;
    keepalive 16;
}

# Port 80: keep serving ACME challenges (renewals need it), redirect the rest.
server {
    listen      80 default_server;
    server_name haisannhaque.com www.haisannhaque.com;

    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://haisannhaque.com$request_uri;
    }
}

# Canonicalise www -> apex so Supabase auth callbacks only ever see one origin.
server {
    listen      443 ssl;
    http2       on;
    server_name www.haisannhaque.com;

    ssl_certificate     /etc/letsencrypt/live/haisannhaque.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haisannhaque.com/privkey.pem;
    include             /etc/nginx/snippets/ssl.conf;

    return 301 https://haisannhaque.com$request_uri;
}

server {
    listen      443 ssl default_server;
    http2       on;
    server_name haisannhaque.com;

    ssl_certificate     /etc/letsencrypt/live/haisannhaque.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haisannhaque.com/privkey.pem;
    include             /etc/nginx/snippets/ssl.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Product image uploads pass through Next.js route handlers.
    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass http://web_upstream;
    }
}
